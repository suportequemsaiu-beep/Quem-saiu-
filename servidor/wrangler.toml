# Quem Saiu — avisos (Fase 1). Ainda NÃO implantado. Veja o README.md desta pasta.
name = "quemsaiu-avisos"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Roda a cada 30 minutos: envia os lembretes que já estão na hora (só entre 9h e 20h no fuso do aparelho).
[triggers]
crons = ["*/30 * * * *"]

[vars]
ORIGENS_PERMITIDAS = "https://quemsaiu.com.br,https://www.quemsaiu.com.br"
VAPID_CONTATO = "mailto:suporte.quemsaiu@gmail.com"

# Depois de criar o banco (veja o README), cole aqui o database_id que o comando mostrar.
[[d1_databases]]
binding = "DB"
database_name = "quemsaiu-avisos"
database_id = "c9a0363c-6e5b-4dd0-8c18-bc421a5cf708"

# Segredos (NÃO ficam neste arquivo): VAPID_PUBLICA e VAPID_PRIVADA_JWK, criados com `wrangler secret put`.
